version: '3.8'

services:
  # ==========================================================
  # MQTT Broker (Eclipse Mosquitto)
  # ==========================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bedroom-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # Standard MQTT TCP port
      - "9001:9001"   # MQTT over WebSockets
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # ==========================================================
  # Database (MongoDB for historical door event logs)
  # ==========================================================
  mongodb:
    image: mongo:latest
    container_name: bedroom-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" # Standard MongoDB port
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo_data:/data/db

volumes:
  mosquitto_data:
  mosquitto_log:
  mongo_data: