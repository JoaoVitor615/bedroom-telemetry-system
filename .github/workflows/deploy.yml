name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,MONGO_DB_NAME
          script: |
            cd ~/bedroom-telemetry-system
            git pull origin main
            cd infra
            
            # Export environment variables for docker-compose to use in runtime
            export MONGO_ROOT_USER=$MONGO_ROOT_USER
            export MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
            export MONGO_DB_NAME=$MONGO_DB_NAME
            
            docker compose down
            docker compose up -d --build